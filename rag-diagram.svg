<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="RAG pipeline: Google Drive to chunks to embeddings to pgvector, then question to semantic search to Llama 3.2 to answer with sources" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.b{fill:none;stroke:#0E0E0E;stroke-width:2}
.t{font:700 22px Helvetica,Arial,sans-serif;fill:#0E0E0E;text-anchor:middle}
.s{font:400 15px Helvetica,Arial,sans-serif;fill:#5F5C55;text-anchor:middle}
.l{font:700 15px Helvetica,Arial,sans-serif;fill:#0E0E0E}
.f{fill:none;stroke:#FF4D1C;stroke-width:3;stroke-dasharray:8 8;animation:d 1.2s linear infinite}
.h{fill:#FF4D1C}
@keyframes d{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>
<text class="l" x="30" y="44">1. Ingest</text>
<g><rect class="b" x="30" y="70" width="170" height="90"/><text class="t" x="115" y="112">Google Drive</text><text class="s" x="115" y="138">monitored</text></g>
<g><rect class="b" x="260" y="70" width="170" height="90"/><text class="t" x="345" y="112">Chunks</text><text class="s" x="345" y="138">split documents</text></g>
<g><rect class="b" x="490" y="70" width="170" height="90"/><text class="t" x="575" y="112">Embeddings</text><text class="s" x="575" y="138">nomic-embed-text</text></g>
<g><rect class="b" x="720" y="70" width="150" height="90" style="fill:#FF4D1C;stroke:#FF4D1C"/><text class="t" x="795" y="112" style="fill:#fff">pgvector</text><text class="s" x="795" y="138" style="fill:#fff">Supabase</text></g>
<path class="f" d="M200 115H260"/><path class="f" d="M430 115H490"/><path class="f" d="M660 115H720"/>
<path class="f" d="M795 160V350"/>
<text class="l" x="30" y="304">2. Ask</text>
<g><rect class="b" x="30" y="330" width="170" height="90"/><text class="t" x="115" y="372">Question</text><text class="s" x="115" y="398">from the user</text></g>
<g><rect class="b" x="260" y="330" width="170" height="90"/><text class="t" x="345" y="372">Search</text><text class="s" x="345" y="398">semantic match</text></g>
<g><rect class="b" x="490" y="330" width="170" height="90"/><text class="t" x="575" y="372">Llama 3.2</text><text class="s" x="575" y="398">local, private</text></g>
<g><rect class="b" x="720" y="350" width="150" height="90"/><text class="t" x="795" y="392">Answer</text><text class="s" x="795" y="418">with sources</text></g>
<path class="f" d="M200 375H260"/><path class="f" d="M430 375H490"/><path class="f" d="M660 375H720"/>
<text class="s" x="450" y="490" style="font-size:16px">Orchestrated with n8n, packaged with Docker</text>
</svg>
