<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="E-commerce platforms Salla and Zid connected through API integrations to ERP and internal operations systems" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.b{fill:none;stroke:#0E0E0E;stroke-width:2}
.t{font:700 24px Helvetica,Arial,sans-serif;fill:#0E0E0E;text-anchor:middle}
.s{font:400 15px Helvetica,Arial,sans-serif;fill:#5F5C55;text-anchor:middle}
.f{fill:none;stroke:#FF4D1C;stroke-width:3;stroke-dasharray:8 8;animation:d 1.2s linear infinite}
.r{animation-direction:reverse}
@keyframes d{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>
<g><rect class="b" x="40" y="100" width="200" height="100"/><text class="t" x="140" y="158">Salla</text></g>
<g><rect class="b" x="40" y="320" width="200" height="100"/><text class="t" x="140" y="378">Zid</text></g>
<g><rect x="340" y="190" width="220" height="140" style="fill:#FF4D1C"/><text class="t" x="450" y="250" style="fill:#fff">API</text><text class="s" x="450" y="282" style="fill:#fff">integration layer</text></g>
<g><rect class="b" x="660" y="100" width="200" height="100"/><text class="t" x="760" y="158">ERP</text></g>
<g><rect class="b" x="660" y="320" width="200" height="100"/><text class="t" x="760" y="370">Operations</text><text class="s" x="760" y="396">internal systems</text></g>
<path class="f" d="M240 150C290 150 290 230 340 240"/><path class="f" d="M240 370C290 370 290 290 340 280"/>
<path class="f r" d="M560 240C610 230 610 150 660 150"/><path class="f r" d="M560 280C610 290 610 370 660 370"/>
<text class="s" x="450" y="480" style="font-size:16px">Manual data workflows become automated data flows</text>
</svg>
